name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка SmartHome.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name SmartHome
          --add-data "1floor.png;."
          --add-data "2floor.png;."
          --add-data "3Region.png;."
          home.py

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-windows
          path: dist/SmartHome.exe

      - name: Публикация релиза (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartHome.exe
          generate_release_notes: true
